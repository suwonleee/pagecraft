<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>周末探索 · 产品概念</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;font-family:Pretendard,'Apple SD Gothic Neo',system-ui,sans-serif;color:#282334;line-height:1.7}.page{max-width:1050px;margin:auto;padding:44px 48px 60px}.document-meta{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eeebf1;padding-bottom:19px;font-size:11px;color:#92879b;letter-spacing:.4px}.wordmark{font-size:15px;font-weight:700;color:#53455f;letter-spacing:2px}.hero{padding:58px 0 38px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:650;color:#8873b0;margin:0 0 14px}h1{font-size:48px;letter-spacing:-2.3px;line-height:1.24;font-weight:650;margin:0 0 20px;max-width:680px}.intro{color:#90849a;font-size:15px;max-width:540px;margin-bottom:27px}.cta{font:inherit;border:0;background:#7b5ba7;color:white;padding:13px 23px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer}.section-label{font-size:10px;letter-spacing:1.8px;color:#a092ad;text-transform:uppercase;margin-bottom:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{padding:23px 22px;border:1px solid #ebe7f0;border-radius:13px;background:#faf8fc;min-height:190px}.card-number{display:block;font-size:11px;color:#a291b5;margin-bottom:22px}.card h2{font-size:17px;line-height:1.4;margin:0 0 10px;font-weight:600;letter-spacing:-.4px}.card p{font-size:12px;color:#918398;margin:0;line-height:1.9}.note{display:flex;align-items:center;gap:15px;margin-top:26px;padding:18px 20px;background:#f6f7f4;border:1px solid #e9ece4;border-radius:10px}.note b{font-size:10px;white-space:nowrap;background:#e5eadf;padding:5px 9px;color:#7c8b6c;border-radius:5px}.note p{font-size:12px;color:#89917d;margin:0}.footer{margin-top:40px;padding-top:17px;border-top:1px solid #efecf3;display:flex;justify-content:space-between;font-size:10px;color:#aa9eb2}@media(max-width:700px){.page{padding:28px 24px}.hero{padding-top:40px}h1{font-size:35px}.cards{grid-template-columns:1fr}.card{min-height:140px}.card-number{margin-bottom:13px}.note{align-items:flex-start}}
  </style>
</head>
<body>
  <!-- Pagecraft sample document. All names and content are fictional. -->
  <main class="page">
    <header class="document-meta"><span class="wordmark">WEEKEND.</span><span>产品概念 · 草稿 01</span></header>
    <section class="hero" data-region="hero">
      <p class="eyebrow">每个周末，都有小小的发现</p>
      <h1 id="hero-title" data-component="title">找到属于您的周末。</h1>
      <p class="intro" data-component="description">不必远行。收藏喜欢的地点和新体验，创造属于自己的周末。</p>
      <button class="cta" id="primary-button" data-component="cta" type="button">探索本周推荐 ↗</button>
    </section>
    <section data-region="features">
      <p class="section-label">体验</p>
      <div class="cards" data-region="cards">
        <article class="card" id="discover-card" data-component="discover"><span class="card-number">01 / 发现</span><h2>发现您的喜好</h2><p>书店、展览、小咖啡馆。<br>找到值得探索的地方。</p></article>
        <article class="card" data-component="collect"><span class="card-number">02 / 收藏</span><h2>收藏特别的地方</h2><p>记录想去的地点。<br>周末到来时，再来看看。</p></article>
        <article class="card" data-component="plan"><span class="card-number">03 / 创造自己的体验</span><h2>让这一天属于您</h2><p>路线与时间，一目了然。<br>安排一天，也留点闲逛的空间。</p></article>
      </div>
    </section>
    <aside class="note"><b>成功标准</b><p>首次访问的用户能在三分钟内收藏一个想去的地点。</p></aside>
    <footer class="footer"><span>产品规划 / 本地草稿</span><span>点击任意位置，开始打造您自己的文档。</span></footer>
  </main>
</body>
</html>
